! M11-R1 - telemetry-relevant reference configuration
! Secrets are redacted. This is not a full raw show running-config.

hostname M11-R1
!
interface Ethernet0/0
 description MGMT-TRANSPORT-to-VMnet2
 ip flow monitor M11-MONITOR input
 ip address 10.99.0.101 255.255.255.0
 no shutdown
!
interface Loopback0
 description MANAGEMENT-LOOPBACK
 ip address 10.255.11.1 255.255.255.255
!
! Loopback1 was used only as a safe telemetry fault-injection target.
interface Loopback1
 description M11-SYSLOG-TEST-2
 ip address 10.255.11.2 255.255.255.255
 no shutdown
!
ip access-list standard ACL-SNMP-NMS
 permit 10.99.0.20
 deny any
!
snmp-server view LIBRENMS-VIEW iso included
snmp-server group LIBRENMS-GRP v3 priv read LIBRENMS-VIEW access ACL-SNMP-NMS
snmp-server user librenms LIBRENMS-GRP v3 auth sha <AUTH_SECRET> priv aes 128 <PRIV_SECRET>
snmp-server location M11-LAB
snmp-server contact Network-Operations
snmp-server ifindex persist
!
! Separate SNMPv3 user used for trap delivery.
snmp-server group TRAP-GRP v3 priv
snmp-server user librenms_user TRAP-GRP v3 auth sha <TRAP_AUTH_SECRET> priv aes 128 <TRAP_PRIV_SECRET>
snmp-server host 10.99.0.20 version 3 priv librenms_user
!
service timestamps log datetime msec show-timezone
logging source-interface Loopback0
logging host 10.99.0.20
logging trap informational
!
ntp server 10.99.0.20
!
flow exporter M11-EXPORTER
 description Export-Flows-to-M11-NMS
 destination 10.99.0.20
 source Loopback0
 transport udp 2055
!
flow monitor M11-MONITOR
 exporter M11-EXPORTER
 record netflow-original
!
end
