# FortiGate reference mapping for the Azure lab.
# Validate exact syntax and cryptographic parameters against the deployed FortiOS version and Azure policy.

config system interface
    edit "LO-AZ-BGP"
        set type loopback
        set ip 10.70.255.1 255.255.255.255
    next
end

config vpn ipsec phase1-interface
    edit "AZURE-M08"
        set interface "port1"
        set ike-version 2
        set remote-gw 172.196.29.142
        set authmethod psk
        set psksecret <PSK>
        set proposal aes256-sha256
    next
end

config vpn ipsec phase2-interface
    edit "AZURE-M08-P2"
        set phase1name "AZURE-M08"
        set proposal aes256-sha256
        set src-subnet 0.0.0.0 0.0.0.0
        set dst-subnet 0.0.0.0 0.0.0.0
    next
end

config router static
    edit 0
        set dst 10.80.0.30 255.255.255.255
        set device "AZURE-M08"
    next
end

config router prefix-list
    edit "AZURE-IN"
        config rule
            edit 10
                set prefix 10.80.0.0 255.255.240.0
            next
            edit 20
                set prefix 10.80.16.0 255.255.240.0
            next
            edit 30
                set prefix 10.80.32.0 255.255.240.0
            next
        end
    next
    edit "ONPREM-OUT"
        config rule
            edit 10
                set prefix 10.70.10.0 255.255.255.0
            next
        end
    next
end

config router route-map
    edit "AZURE-IN"
        config rule
            edit 10
                set match-ip-address "AZURE-IN"
            next
        end
    next
    edit "ONPREM-OUT"
        config rule
            edit 10
                set match-ip-address "ONPREM-OUT"
            next
        end
    next
end

config router bgp
    set as 65070
    set router-id 10.70.255.1
    config neighbor
        edit "10.80.0.30"
            set remote-as 65515
            set update-source "LO-AZ-BGP"
            set ebgp-enforce-multihop enable
            set route-map-in "AZURE-IN"
            set route-map-out "ONPREM-OUT"
        next
    end
    config network
        edit 1
            set prefix 10.70.10.0 255.255.255.0
        next
    end
end

# Firewall policies should permit both directions between on-prem LAN and AZURE-M08.
# Hybrid private traffic should normally use `set nat disable`.
