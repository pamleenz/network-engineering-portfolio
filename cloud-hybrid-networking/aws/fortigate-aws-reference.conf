# FortiGate conceptual reference for AWS dual-tunnel Site-to-Site VPN.
# Example addresses are documentation-only. Use AWS-generated parameters in a real deployment.

config vpn ipsec phase1-interface
    edit "AWS-TUN1"
        set interface "port1"
        set ike-version 2
        set remote-gw 203.0.113.10
        set psksecret <TUNNEL1-PSK>
        set proposal aes256-sha256
    next
    edit "AWS-TUN2"
        set interface "port1"
        set ike-version 2
        set remote-gw 203.0.113.20
        set psksecret <TUNNEL2-PSK>
        set proposal aes256-sha256
    next
end

config vpn ipsec phase2-interface
    edit "AWS-TUN1-P2"
        set phase1name "AWS-TUN1"
        set proposal aes256-sha256
        set src-subnet 0.0.0.0 0.0.0.0
        set dst-subnet 0.0.0.0 0.0.0.0
    next
    edit "AWS-TUN2-P2"
        set phase1name "AWS-TUN2"
        set proposal aes256-sha256
        set src-subnet 0.0.0.0 0.0.0.0
        set dst-subnet 0.0.0.0 0.0.0.0
    next
end

config system interface
    edit "AWS-TUN1"
        set ip 169.254.10.2 255.255.255.252
        set remote-ip 169.254.10.1 255.255.255.252
    next
    edit "AWS-TUN2"
        set ip 169.254.20.2 255.255.255.252
        set remote-ip 169.254.20.1 255.255.255.252
    next
end

config router bgp
    set as 65070
    set router-id 10.70.255.1
    config neighbor
        edit "169.254.10.1"
            set remote-as 64512
        next
        edit "169.254.20.1"
            set remote-as 64512
        next
    end
    config network
        edit 1
            set prefix 10.70.0.0 255.255.0.0
        next
    end
end

