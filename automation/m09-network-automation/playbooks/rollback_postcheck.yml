---
- name: Verify scoped BGP rollback without destroying the BGP service
  hosts: cisco_routers
  gather_facts: false
  vars_files:
    - ../data/changes/CHG-M09-001.yml
    - ../data/devices.yml
  vars:
    device: "{{ devices[inventory_hostname] }}"
    prefix: "{{ change.objective.advertise_prefix }}"
    prefix_address: "{{ prefix.split('/')[0] }}"
    prefix_netmask: "{{ prefix | ansible.utils.ipaddr('netmask') }}"
  tasks:
    - name: Read current BGP configuration and prefix advertisement
      cisco.ios.ios_command:
        commands:
          - "show running-config | section ^router bgp"
          - "show running-config | include ^ip route"
          - "show ip bgp neighbors {{ device.peer_ip }} advertised-routes"
      register: evidence
      changed_when: false

    - name: Assert change-owned prefix was withdrawn and BGP AS preserved
      ansible.builtin.assert:
        that:
          - "'router bgp ' ~ (device.local_as | string) in evidence.stdout[0]"
          - "('network ' ~ prefix_address ~ ' mask ' ~ prefix_netmask) not in evidence.stdout[0]"
          - "('ip route ' ~ prefix_address ~ ' ' ~ prefix_netmask ~ ' Null0') not in evidence.stdout[1]"
          - "prefix not in evidence.stdout[2]"
        fail_msg: "Rollback verification failed: review full BGP, static routes, and exact advertised prefix manually."
        success_msg: "Scoped rollback checks passed; BGP process preserved."
