---
# Legacy static example. Scoped to the prefix; never remove the entire BGP process.
# Only run if the prefix and Null0 route were introduced by this change.
- name: Roll back example prefix advertisement
  hosts: cisco_routers
  gather_facts: false
  tasks:
    - name: Remove exact network advertisement only
      cisco.ios.ios_config:
        parents: [router bgp 65010]
        lines:
          - no network 203.0.113.0 mask 255.255.255.0
    - name: Remove exact change-owned Null0 route
      cisco.ios.ios_config:
        lines:
          - no ip route 203.0.113.0 255.255.255.0 Null0
