---
- name: Data-driven BGP post-check
  hosts: cisco_routers
  gather_facts: false

  vars_files:
    - ../data/changes/CHG-M09-001.yml
    - ../data/devices.yml

  vars:
    device: "{{ devices[inventory_hostname] }}"
    prefix: "{{ change.objective.advertise_prefix }}"
    prefix_address: "{{ change.objective.advertise_prefix.split('/')[0] }}"

  tasks:
    - name: Wait for BGP session to establish
      ansible.netcommon.cli_command:
        command: "show ip bgp neighbors {{ device.peer_ip }} | include BGP state"
      register: bgp_session
      until: "'Established' in bgp_session.stdout"
      retries: 12
      delay: 5
      changed_when: false

    - name: Verify BGP prefix
      ansible.netcommon.cli_command:
        command: "show ip bgp {{ prefix_address }}"
      register: bgp_prefix
      until:
        - "prefix_address in bgp_prefix.stdout"
        - "'best' in bgp_prefix.stdout"
      retries: 6
      delay: 5
      changed_when: false

    - name: Verify prefix advertised
      ansible.netcommon.cli_command:
        command: "show ip bgp neighbors {{ device.peer_ip }} advertised-routes"
      register: advertised_prefix
      until: "prefix_address in advertised_prefix.stdout"
      retries: 6
      delay: 5
      changed_when: false

    - name: Post-check passed
      ansible.builtin.debug:
        msg: "{{ change.id }} POST-CHECK PASSED"
