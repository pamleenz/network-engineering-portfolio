---
- name: BGP change pre-check
  hosts: cisco_routers
  gather_facts: false

  tasks:
    - name: Run pre-check commands
      cisco.ios.ios_command:
        commands:
          - show ip interface brief
          - show ip bgp summary
          - show ip route 203.0.113.0
          - show running-config | section router bgp
      register: precheck

    - name: Display pre-check results
      ansible.builtin.debug:
        var: precheck.stdout_lines