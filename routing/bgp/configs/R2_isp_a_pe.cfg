hostname R2
!
interface Ethernet0/0
 description TO-CUSTOMER-R1
 ip address 10.0.12.2 255.255.255.252
 no shutdown
!
interface Ethernet0/2
 description TO-R4
 ip address 10.0.24.2 255.255.255.252
 no shutdown
!
interface Loopback0
 ip address 198.51.100.1 255.255.255.255
!
ip route 198.18.100.0 255.255.255.0 Null0
ip route 192.0.2.254 255.255.255.255 Null0
!
ip bgp-community new-format
ip community-list standard R1-RTBH-COMM permit 65002:666
!
ip prefix-list R1-NORMAL seq 10 permit 192.0.2.0/24
ip prefix-list R1-NORMAL seq 20 permit 198.18.101.0/24
ip prefix-list R1-RTBH seq 10 permit 192.0.2.0/24 ge 32
!
route-map R1-IN permit 10
 match ip address prefix-list R1-RTBH
 match community R1-RTBH-COMM
 set local-preference 250
 set community no-export additive
 set ip next-hop 192.0.2.254
route-map R1-IN permit 20
 match ip address prefix-list R1-NORMAL
 set local-preference 200
 set community 65002:100 additive
!
router bgp 65002
 bgp router-id 198.51.100.1
 bgp log-neighbor-changes
 network 198.18.100.0
 network 198.51.100.1 mask 255.255.255.255
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.12.1 description EBGP-TO-R1
 ! LAB-SPECIFIC: retained for the IOL RTBH dummy-next-hop behaviour observed in this lab
 neighbor 10.0.12.1 ebgp-multihop 2
 neighbor 10.0.12.1 route-map R1-IN in
 neighbor 10.0.12.1 maximum-prefix 5 80
 neighbor 10.0.24.1 remote-as 65002
 neighbor 10.0.24.1 description IBGP-TO-R4
 neighbor 10.0.24.1 next-hop-self
 neighbor 10.0.24.1 send-community
