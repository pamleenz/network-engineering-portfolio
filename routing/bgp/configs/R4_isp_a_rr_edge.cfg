hostname R4
!
interface Ethernet0/0
 description TO-R2
 ip address 10.0.24.1 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description TO-R5
 ip address 10.0.45.1 255.255.255.252
 no shutdown
!
interface Loopback0
 ip address 198.51.100.4 255.255.255.255
!
router bgp 65002
 bgp router-id 198.51.100.4
 bgp log-neighbor-changes
 network 198.51.100.4 mask 255.255.255.255
 neighbor 10.0.24.2 remote-as 65002
 neighbor 10.0.24.2 description IBGP-TO-R2
 neighbor 10.0.24.2 route-reflector-client
 neighbor 10.0.45.2 remote-as 65004
 neighbor 10.0.45.2 description EBGP-TO-R5
