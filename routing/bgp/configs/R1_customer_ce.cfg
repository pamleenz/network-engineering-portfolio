hostname R1
!
interface Ethernet0/0
 description TO-ISP-A-R2
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description TO-ISP-B-R3
 ip address 10.0.13.1 255.255.255.252
 no shutdown
!
interface Loopback0
 ip address 192.0.2.1 255.255.255.255
!
ip route 192.0.2.0 255.255.255.0 Null0
ip route 198.18.101.0 255.255.255.0 Null0
!
ip prefix-list CUSTOMER-OUT seq 10 permit 192.0.2.0/24
ip prefix-list CUSTOMER-OUT seq 20 permit 198.18.101.0/24
ip prefix-list CUSTOMER-PREFIX seq 10 permit 192.0.2.0/24
ip prefix-list CUSTOMER-PREFIX seq 20 permit 198.18.101.0/24
ip prefix-list INTERNET-TEST seq 10 permit 198.18.100.0/24
!
route-map FROM-ISP-A permit 10
 match ip address prefix-list INTERNET-TEST
 set local-preference 200
route-map FROM-ISP-A permit 20
!
route-map FROM-ISP-B permit 10
 match ip address prefix-list INTERNET-TEST
 set local-preference 100
route-map FROM-ISP-B permit 20
!
route-map TO-ISP-B-PREPEND permit 10
 match ip address prefix-list CUSTOMER-PREFIX
 set as-path prepend 65001 65001
!
router bgp 65001
 bgp router-id 192.0.2.1
 bgp log-neighbor-changes
 network 192.0.2.0
 network 198.18.101.0
 neighbor 10.0.12.2 remote-as 65002
 neighbor 10.0.12.2 description EBGP-TO-ISP-A
 neighbor 10.0.12.2 send-community
 neighbor 10.0.12.2 prefix-list CUSTOMER-OUT out
 neighbor 10.0.12.2 route-map FROM-ISP-A in
 neighbor 10.0.13.2 remote-as 65003
 neighbor 10.0.13.2 description EBGP-TO-ISP-B
 neighbor 10.0.13.2 prefix-list CUSTOMER-OUT out
 neighbor 10.0.13.2 route-map FROM-ISP-B in
 neighbor 10.0.13.2 route-map TO-ISP-B-PREPEND out
