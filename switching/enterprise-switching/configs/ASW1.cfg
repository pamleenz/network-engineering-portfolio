! Clean reference configuration - ASW1
hostname ASW1
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
!
vlan 10
 name CORP-USERS
vlan 20
 name ENGINEERING
vlan 30
 name GUEST
vlan 40
 name SERVICES
vlan 99
 name MANAGEMENT
vlan 999
 name NATIVE-BLACKHOLE
!
interface Ethernet0/0
 description TRUNK-TO-DSW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99,999
 ip dhcp snooping trust
!
interface Ethernet0/1
 description TRUNK-TO-DSW2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99,999
 ip dhcp snooping trust
!
interface Ethernet0/2
 description CLIENT-CORP-USERS
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface Ethernet0/3
 description SRV1-SERVICES
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface Vlan99
 description ASW1-MANAGEMENT
 ip address 10.10.99.11 255.255.255.0
!
ip default-gateway 10.10.99.1
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
!
lldp run
ip domain name lab.local
username netadmin privilege 15 secret <REDACTED-LAB-SECRET>
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
!
! Storm-control was not available in the current IOL image.
! DAI / IP Source Guard were discussed but not enabled without a real DHCP binding database.
