! Clean reference configuration - DSW2
hostname DSW2
!
ip routing
spanning-tree mode rapid-pvst
spanning-tree vlan 30,40 priority 24576
spanning-tree vlan 10,20,99,999 priority 28672
!
vlan 10
 name CORP-USERS
vlan 20
 name ENGINEERING
vlan 30
 name GUEST
vlan 40
 name SERVICES
vlan 99
 name MANAGEMENT
vlan 999
 name NATIVE-BLACKHOLE
!
interface Port-channel1
 description LACP-TO-DSW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99,999
!
interface Ethernet0/0
 description TO-DSW1-LINK1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99,999
 channel-group 1 mode active
!
interface Ethernet0/1
 description TO-DSW1-LINK2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99,999
 channel-group 1 mode active
!
interface Ethernet0/2
 description TO-ASW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,99,999
 spanning-tree guard root
!
interface Ethernet0/3
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Vlan10
 description GW-CORP-USERS
 ip address 10.10.10.3 255.255.255.0
 ip helper-address 10.10.40.10
 standby 10 ip 10.10.10.1
 standby 10 priority 100
 standby 10 preempt
!
interface Vlan20
 description GW-ENGINEERING
 ip address 10.10.20.3 255.255.255.0
 ip helper-address 10.10.40.10
 standby 20 ip 10.10.20.1
 standby 20 priority 100
 standby 20 preempt
!
interface Vlan30
 description GW-GUEST
 ip address 10.10.30.3 255.255.255.0
 ip helper-address 10.10.40.10
 standby 30 ip 10.10.30.1
 standby 30 priority 110
 standby 30 preempt
!
interface Vlan40
 description GW-SERVICES
 ip address 10.10.40.3 255.255.255.0
 standby 40 ip 10.10.40.1
 standby 40 priority 110
 standby 40 preempt
!
interface Vlan99
 description GW-MANAGEMENT
 ip address 10.10.99.3 255.255.255.0
 standby 99 ip 10.10.99.1
 standby 99 priority 100
 standby 99 preempt
