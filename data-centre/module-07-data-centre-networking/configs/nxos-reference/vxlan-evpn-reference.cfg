! Cisco NX-OS production reference - not claimed as hands-on N9Kv execution
feature ospf
feature bgp
feature nv overlay
feature vn-segment-vlan-based
nv overlay evpn
!
vlan 100
  vn-segment 10100
vlan 200
  vn-segment 10200
!
vrf context TENANT-A
  vni 50000 l3
!
fabric forwarding anycast-gateway-mac 0000.2222.3333
!
interface Vlan100
  no shutdown
  vrf member TENANT-A
  ip address 192.168.100.1/24
  fabric forwarding mode anycast-gateway
!
interface Vlan200
  no shutdown
  vrf member TENANT-A
  ip address 192.168.200.1/24
  fabric forwarding mode anycast-gateway
!
interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback0
  member vni 10100
    ingress-replication protocol bgp
  member vni 10200
    ingress-replication protocol bgp
  member vni 50000 associate-vrf
!
router bgp 65000
  address-family l2vpn evpn
  ! EVPN neighbors / RR policy omitted here; use loopback-sourced iBGP as in the lab design.
!
vrf context TENANT-A
  address-family ipv4 unicast
    ! Production Type-5 export/import policy belongs here in the platform-specific design.
!
! Useful verification:
! show nve interface nve1 detail
! show nve peers
! show nve vni
! show bgp l2vpn evpn
! show l2route evpn mac-ip all
! show l2route evpn imet all
! show ip route vrf TENANT-A
