! Cisco NX-OS vPC reference configuration / expected operational model only
feature lacp
feature vpc
!
vpc domain 10
  peer-keepalive destination <PEER-IP> source <LOCAL-IP> vrf <KEEPALIVE-VRF>
!
interface port-channel10
  switchport
  switchport mode trunk
  spanning-tree port type network
  vpc peer-link
!
interface port-channel20
  switchport
  switchport mode trunk
  vpc 20
!
! Verify:
! show vpc brief
! show vpc peer-keepalive
! show vpc role
! show vpc consistency-parameters global
! show vpc consistency-parameters interface port-channel20
! show port-channel summary
