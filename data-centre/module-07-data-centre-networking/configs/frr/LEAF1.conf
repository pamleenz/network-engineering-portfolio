! Reconstructed from verified lab state - key FRR elements
vrf TENANT-A
 vni 50000
exit-vrf
!
interface lo
 ip address 10.255.1.1/32
!
interface eth0
 ip address 10.0.0.1/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth1
 ip address 10.0.0.5/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
router ospf
 ospf router-id 10.255.1.1
 passive-interface lo
!
router bgp 65000
 bgp router-id 10.255.1.1
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source lo
 address-family l2vpn evpn
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.2 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65000 vrf TENANT-A
 bgp router-id 10.255.1.1
 address-family ipv4 unicast
  network 10.10.50.0/24
  network 192.168.100.0/24
  network 192.168.200.0/24
 exit-address-family
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import auto
 exit-address-family
