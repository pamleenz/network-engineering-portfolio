# FortiGate clean reference excerpts from the completed lab.
# Not a full system export. Review before reuse.
# Secrets are intentionally omitted/redacted.

# --- Interfaces ---
config system interface
    edit "port1"
        set mode dhcp
        set role wan
        set alias "WAN1"
    next
    edit "port2"
        set ip 10.10.10.1 255.255.255.0
        set role lan
        set alias "CORP-LAN"
    next
    edit "port3"
        set ip 172.16.2.2 255.255.255.252
        set allowaccess ping
        set role wan
        set alias "WAN2"
        set description "SD-WAN ISP2 Underlay"
    next
end

# --- Address objects ---
config firewall address
    edit "CORP-LAN"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "BRANCH-LAN"
        set subnet 10.20.20.0 255.255.255.0
    next
end

# --- SD-WAN ---
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "port1"
        next
        edit 2
            set interface "port3"
            set gateway 172.16.2.1
        next
    end
    config health-check
        edit "INTERNET_SLA"
            set server "8.8.8.8"
            set protocol ping
            set interval 1000
            set probe-timeout 1000
            set members 1 2
            config sla
                edit 1
                    set latency-threshold 80
                    set jitter-threshold 30
                    set packetloss-threshold 5
                    set link-cost-factor latency jitter packet-loss
                next
            end
        next
    end
    config service
        edit 1
            set name "CORP-INTERNET-SLA"
            set mode sla
            set src "10.10.10.0/255.255.255.0"
            set dst "0.0.0.0/0.0.0.0"
            config sla
                edit "INTERNET_SLA"
                    set id 1
                next
            end
            set priority-members 2 1
        next
    end
end

# --- Route-based IKEv2 IPsec ---
# LAB ONLY: DES was required by the constrained EVAL image.
# Production: use modern supported AES-based proposals.
config vpn ipsec phase1-interface
    edit "HQ-BRANCH-WAN1"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal des-sha256
        set dhgrp 14
        set remote-gw 192.168.201.134
        # set psksecret <REDACTED>
    next
end

config vpn ipsec phase2-interface
    edit "HQ-BRANCH-WAN1-P2"
        set phase1name "HQ-BRANCH-WAN1"
        set proposal des-sha256
        set dhgrp 14
        set src-subnet 10.10.10.0 255.255.255.0
        set dst-subnet 10.20.20.0 255.255.255.0
    next
end

# --- Static routes ---
config router static
    edit 10
        set dst 10.20.20.0 255.255.255.0
        set device "HQ-BRANCH-WAN1"
    next
    edit 20
        set distance 1
        set sdwan-zone "virtual-wan-link"
    next
end

# --- Firewall policies ---
config firewall policy
    edit 1
        set name "CORP-LAN-to-INTERNET"
        set srcintf "port2"
        set dstintf "virtual-wan-link"
        set action accept
        set srcaddr "CORP-LAN"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ssl-ssh-profile "no-inspection"
        set av-profile "default"
        set webfilter-profile "monitor-all"
        set ips-sensor "protect_client"
        set application-list "default"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "CORP-to-BRANCH-WAN1"
        set srcintf "port2"
        set dstintf "HQ-BRANCH-WAN1"
        set action accept
        set srcaddr "CORP-LAN"
        set dstaddr "BRANCH-LAN"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "BRANCH-WAN1-to-CORP"
        set srcintf "HQ-BRANCH-WAN1"
        set dstintf "port2"
        set action accept
        set srcaddr "BRANCH-LAN"
        set dstaddr "CORP-LAN"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

